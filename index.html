<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reaktionsspiel</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            text-align: center;
        }

        h1 {
            margin-top: 30px;
        }

        #info {
            font-size: 22px;
            margin: 15px;
        }

        #game {
            width: 90vw;
            max-width: 700px;
            height: 450px;
            margin: 20px auto;
            background: #222;
            border: 3px solid white;
            position: relative;
            overflow: hidden;
        }

        #target {
            width: 50px;
            height: 50px;
            background: red;
            border-radius: 50%;
            position: absolute;
            display: none;
            cursor: pointer;
        }

        button {
            padding: 12px 25px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin: 5px;
        }

        #start {
            background: white;
            color: black;
        }

        #home {
            background: #444;
            color: white;
        }
    </style>
</head>

<body>

    <h1>🎯 Reaktionsspiel</h1>

    <div id="info">
        Klicke auf den roten Punkt so schnell wie möglich!
    </div>

    <div id="time">
        Letzte Zeit: -
    </div>

    <div id="best">
        Beste Zeit: -
    </div>

    <button id="start" onclick="startGame()">
        ▶️ Start
    </button>

    <button id="home" onclick="location.href='../'">
        🏠 Startseite
    </button>

    <div id="game">

        <div id="target" onclick="targetClicked()"></div>

    </div>

    <script>

        let startTime = 0;

        let bestTime = null;

        let gameRunning = false;


        function startGame() {

            gameRunning = false;

            document.getElementById("info").textContent =
                "Warte auf den Punkt...";

            document.getElementById("target").style.display = "none";


            // Zufällige Wartezeit
            let waitTime =
                Math.floor(Math.random() * 3000) + 1000;


            setTimeout(function() {

                showTarget();

            }, waitTime);

        }


        function showTarget() {

            let target =
                document.getElementById("target");

            let game =
                document.getElementById("game");


            // Zufällige Position
            let maxX =
                game.clientWidth - 50;

            let maxY =
                game.clientHeight - 50;


            let x =
                Math.random() * maxX;

            let y =
                Math.random() * maxY;


            target.style.left = x + "px";

            target.style.top = y + "px";


            target.style.display = "block";


            // ⏱️ Zeitmessung startet hier
            startTime = performance.now();

            gameRunning = true;

        }


        function targetClicked() {

            if (!gameRunning) {
                return;
            }


            // ⏱️ Zeitmessung stoppen
            let endTime = performance.now();


            let reactionTime =
                Math.round(endTime - startTime);


            gameRunning = false;


            document.getElementById("target").style.display =
                "none";


            // Zeit anzeigen
            document.getElementById("time").textContent =
                "Letzte Zeit: " + reactionTime + " ms";


            // Beste Zeit überprüfen
            if (
                bestTime === null ||
                reactionTime < bestTime
            ) {

                bestTime = reactionTime;

                document.getElementById("best").textContent =
                    "🏆 Beste Zeit: " + bestTime + " ms";

            }


            document.getElementById("info").textContent =
                "Gut gemacht! Drücke Start für eine neue Runde.";

        }

    </script>

</body>
</html>
