<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reaktionsspiel</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
    text-align: center;
}

h1 {
    margin-top: 25px;
}

#info {
    font-size: 20px;
    margin: 10px;
}

#timer {
    font-size: 24px;
    margin: 10px;
}

#game {
    width: 90vw;
    max-width: 700px;
    height: 450px;
    margin: 20px auto;
    background: #222;
    border: 3px solid white;
    position: relative;
    overflow: hidden;
}

#target {
    width: 50px;
    height: 50px;
    background: red;
    border-radius: 50%;
    position: absolute;
    display: none;
    cursor: pointer;
}

button {
    padding: 12px 25px;
    margin: 5px;
    font-size: 18px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
}

#start {
    background: white;
    color: black;
}

#home {
    background: #444;
    color: white;
}

#results {
    max-width: 500px;
    margin: 20px auto;
    text-align: left;
    font-size: 18px;
}

.result {
    padding: 8px;
    border-bottom: 1px solid #444;
}
</style>
</head>

<body>

<h1>🎯 Reaktionsspiel</h1>

<div id="info">
Runde: 0 / 10
</div>

<div id="timer">
Letzte Zeit: -
</div>

<button id="start" onclick="startGame()">
▶️ Start
</button>

<button id="home" onclick="location.href='../'">
🏠 Startseite
</button>

<div id="game">

<div id="target" onclick="targetClicked()"></div>

</div>

<h2>📊 Deine Zeiten</h2>

<div id="results">
Noch keine Ergebnisse.
</div>

<script>

let startTime = 0;

let round = 0;

let times = [];

let gameRunning = false;


/* Spiel starten */

function startGame() {

    round = 0;

    times = [];

    gameRunning = false;

    document.getElementById("results").innerHTML =
        "Noch keine Ergebnisse.";

    document.getElementById("timer").textContent =
        "Warte...";

    nextRound();

}


/* Nächste Runde */

function nextRound() {

    if (round >= 10) {

        finishGame();

        return;

    }

    round++;

    gameRunning = false;

    document.getElementById("info").textContent =
        "Runde: " + round + " / 10";

    document.getElementById("timer").textContent =
        "Warte...";

    document.getElementById("target").style.display =
        "none";


    /*
    Der Punkt erscheint nach einer
    zufälligen Zeit.
    */

    let waitTime =
        Math.floor(Math.random() * 1500) + 500;


    setTimeout(function() {

        showTarget();

    }, waitTime);

}


/* Punkt anzeigen */

function showTarget() {

    let target =
        document.getElementById("target");

    let game =
        document.getElementById("game");


    let maxX =
        game.clientWidth - 50;

    let maxY =
        game.clientHeight - 50;


    let x =
        Math.random() * maxX;

    let y =
        Math.random() * maxY;


    target.style.left =
        x + "px";

    target.style.top =
        y + "px";


    target.style.display =
        "block";


    /* Timer starten */

    startTime =
        performance.now();

    gameRunning = true;

    document.getElementById("timer").textContent =
        "Zeit läuft...";

}


/* Punkt wurde geklickt */

function targetClicked() {

    if (!gameRunning) {

        return;

    }


    let endTime =
        performance.now();


    let reactionTime =
        Math.round(
            endTime - startTime
        );


    times.push(reactionTime);


    gameRunning = false;


    document.getElementById("target").style.display =
        "none";


    document.getElementById("timer").textContent =
        reactionTime + " ms";


    showResults();


    /*
    SOFORT nächste Runde.
    Keine Pause.
    */

    nextRound();

}


/* Zeiten anzeigen */

function showResults() {

    let results =
        document.getElementById("results");


    results.innerHTML = "";


    times.forEach(function(time, index) {

        let row =
            document.createElement("div");


        row.className =
            "result";


        row.textContent =
            "Runde " +
            (index + 1) +
            ": " +
            time +
            " ms";


        results.appendChild(row);

    });

}


/* Spiel beendet */

function finishGame() {

    gameRunning = false;


    document.getElementById("target").style.display =
        "none";


    let total = 0;


    times.forEach(function(time) {

        total += time;

    });


    let average =
        Math.round(
            total / times.length
        );


    let best =
        Math.min(...times);


    let worst =
        Math.max(...times);


    document.getElementById("info").textContent =
        "🎉 10 Runden geschafft!";


    document.getElementById("timer").innerHTML =
        "⚡ Durchschnitt: " +
        average +
        " ms<br>" +
        "🏆 Beste Zeit: " +
        best +
        " ms<br>" +
        "🐢 Langsamste Zeit: " +
        worst +
        " ms";

}

</script>

</body>
</html>
